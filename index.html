    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://gonuldentatlar.com/" />

    <title>Gönülden Tatlar | Cup, Waffle ve Tatlılar</title>
    <meta
      name="description"
      content="Gönülden Tatlar'ın birbirinden lezzetli cup, waffle, milkshake ve tatlılarını keşfet. Favori tatlılarını kolayca sipariş ver."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gönülden Tatlar" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="Gönülden Tatlar | Cup, Waffle ve Tatlılar" />
    <meta
      property="og:description"
      content="Gönülden hazırlanan cup tatlılar, waffle, milkshake ve dondurmalar. Favorini seç, gerisini bize bırak."
    />
    <meta property="og:image" content="/images/hero/og-cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/images/hero/hero-cup.svg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /* GitHub Pages 404 fallback'inden gelen yolu adres çubuğuna geri yaz */
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
