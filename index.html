    <title>Gönülden Tatlar | Magnolya ve Cup Tatlılar</title>

      content="Gönülden Tatlar'ın taze meyveli, bisküvili ve çikolatalı magnolya ile cup tatlılarını keşfet. Favorini seç, WhatsApp'tan kolayca sipariş ver."

    <meta property="og:type" content="website" />

      content="Gönülden hazırlanan magnolya ve cup tatlılar. Favorini seç, gerisini bize bırak."
    />
    <!--
      WhatsApp, Facebook ve X'in önizleme botları JavaScript çalıştırmaz; yalnızca
      bu ham HTML'i okurlar. Bu yüzden adresler mutlak olmak zorunda — göreli yol
      verildiğinde paylaşım görseli hiç görünmüyordu. Sayfa içi gezinmede aynı
      etiketleri lib/seo.ts yeniden yazar.
    -->
    <meta property="og:url" content="https://gonuldentatlar.com/" />
    <meta property="og:image" content="https://gonuldentatlar.com/images/hero/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kavanozlarda çilekli, muzlu ve çikolatalı magnolya tatlıları" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gönülden Tatlar | Magnolya ve Cup Tatlılar" />
    <meta
      name="twitter:description"
      content="Gönülden hazırlanan magnolya ve cup tatlılar. Favorini seç, gerisini bize bırak."
    />
    <meta name="twitter:image" content="https://gonuldentatlar.com/images/hero/og-cover.jpg" />

    <link rel="preload" as="image" href="/images/products/cilekli-red-velvet-magnolya.webp" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /* GitHub Pages 404 fallback'inden gelen yolu adres çubuğuna geri yaz */
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
