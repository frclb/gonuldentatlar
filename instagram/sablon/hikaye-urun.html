<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hikaye-ortak.css">
<style>
  .head { position: absolute; left: 88px; right: 88px; top: 250px; }
  .hi { margin-top: 40px; font-size: 84px; transform: rotate(-3deg); transform-origin: left; }
  h1 { margin-top: 8px; font-size: 128px; line-height: .95; }

  .arch.main { left: 72px; top: 690px; width: 540px; height: 760px; --s: .771; --x: 200; --y: 100;
    background-image: url('../../public/images/products/cilekli-magnolya.webp'); }

  .inside { position: absolute; left: 650px; right: 72px; top: 720px; }
  .inside h2 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; font-size: 40px; color: var(--cocoa-600); }
  .inside ol { list-style: none; padding: 0; margin-top: 18px; }
  .inside li { display: flex; align-items: center; gap: 16px; padding: 26px 0; border-bottom: 1.5px solid var(--line); font-size: 30px; font-weight: 600; color: var(--cocoa-800); }
  .inside li span { font-family: 'Fraunces', serif; font-weight: 400; font-size: 26px; color: var(--cocoa-400); width: 38px; }
  .inside li i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1.5px rgba(64, 37, 26, .2); margin-left: auto; }
  .heart { position: absolute; left: 700px; top: 1270px; font-size: 46px; color: var(--blush); transform: rotate(-4deg); line-height: 1.05; }

  .quote { position: absolute; left: 88px; right: 88px; top: 1488px; font-family: 'Fraunces', serif; font-style: italic; font-size: 36px; line-height: 1.4; color: var(--cocoa-800); }
  .cta { position: absolute; left: 88px; right: 88px; top: 1612px; display: flex; align-items: center; gap: 28px; }
  .cta .pill { padding: 20px 36px; font-size: 30px; }
  .cta .meta { font-size: 26px; line-height: 1.35; }
</style>
</head>
<body>
  <header class="head z">
    <div class="eyebrow"><img src="marka-isareti-kakao.svg" alt="">Gönülden Tatlar · Bursa</div>
    <p class="script hi">tanıştıralım:</p>
    <h1>Çilekli<br><em>Magnolya</em></h1>
  </header>

  <div class="arch main z"></div>

  <section class="inside z">
    <h2>İçinde neler var?</h2>
    <ol>
      <li><span>01</span>Bisküvi kırığı<i style="--c:var(--K)"></i></li>
      <li><span>02</span>Magnolya kreması<i style="--c:var(--C)"></i></li>
      <li><span>03</span>Taze çilek<i style="--c:var(--S)"></i></li>
      <li><span>04</span>Bisküvi tabanı<i style="--c:var(--K)"></i></li>
    </ol>
  </section>
  <p class="script heart z">cup ya da<br>kavanozda ♡</p>

  <p class="quote z">“Meyveleri her sabah seçiyor, kremaları günlük çırpıyoruz.”</p>
  <div class="cta z">
    <span class="pill">DM’den yaz</span>
    <p class="meta">ya da WhatsApp<br><b>0535 873 43 73</b></p>
  </div>
</body>
</html>
