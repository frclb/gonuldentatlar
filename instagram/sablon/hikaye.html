<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hikaye-ortak.css">
<style>
  /* Tam ekran fotoğraf. Zemin: python3 zemin-uzat.py <site.webp> zemin.png 1.167 -276 378 */
  body { background: #efe6d6; }
  body::before, body::after { display: none; }
  .bg { position: absolute; inset: 0; width: 1080px; height: 1920px; }

  .head { position: absolute; left: 72px; right: 72px; top: 250px; }
  .hi { margin-top: 26px; font-size: 80px; color: #b0523f; transform: rotate(-3deg); transform-origin: left; }
  h1 { margin-top: 2px; font-size: 112px; line-height: 1; white-space: nowrap; }
  h1 em { color: #b0523f; }
  .sub { margin-top: 18px; font-size: 32px; line-height: 1.35; color: #5c4537; }

  /* Katmanlar: nokta kabın kenarında, ince çizgi yatay, etiket sağda */
  .kat { position: absolute; display: flex; align-items: center; transform: translateY(-50%); }
  .kat i { width: 16px; height: 16px; flex: none; border-radius: 50%; background: var(--c);
           box-shadow: 0 0 0 3px rgba(253, 250, 245, .95), 0 2px 8px rgba(64, 37, 26, .35); }
  .kat u { display: block; height: 2px; background: rgba(64, 37, 26, .42); }
  .kat span { padding-left: 16px; font-size: 31px; font-weight: 600; color: var(--cocoa-900); white-space: nowrap; }

  .soz { position: absolute; left: 72px; right: 72px; top: 1432px; font-family: 'Fraunces', serif; font-style: italic; font-size: 38px; line-height: 1.32; color: var(--cocoa-800); }
  .cta { position: absolute; left: 72px; right: 72px; top: 1560px; display: flex; align-items: center; gap: 30px; }
  .cta .meta { font-size: 28px; line-height: 1.32; }
</style>
</head>
<body>
  <img class="bg" src="zemin.png" alt="">
  <header class="head z">
    <div class="eyebrow"><img src="marka-isareti-kakao.svg" alt="">Gönülden Tatlar · Bursa</div>
    <p class="script hi">tanıştıralım:</p>
    <h1>Çilekli <em>Magnolya</em></h1>
    <p class="sub">Süt kreması, bisküvi kırıkları ve dilimlenmiş taze çilek.</p>
  </header>

  <div id="katmanlar" class="z"></div>

  <p class="soz z">“Meyveleri her sabah seçiyor,<br>kremaları günlük çırpıyoruz.”</p>
  <div class="cta z">
    <span class="pill">Sipariş için DM’den yaz</span>
    <p class="meta">ya da WhatsApp<br><b>0536 994 85 17</b></p>
  </div>

<script>
  const etiketX = 700
  const katmanlar = [
    { ad: 'Bisküvi kırığı', c: 'var(--K)', x: 606, y: 966 },
    { ad: 'Magnolya kreması', c: 'var(--cream-50)', x: 606, y: 1034 },
    { ad: 'Taze çilek', c: 'var(--S)', x: 592, y: 1162 },
    { ad: 'Bisküvi tabanı', c: 'var(--K)', x: 566, y: 1284 },
  ]
  const yer = document.getElementById('katmanlar')
  for (const k of katmanlar) {
    yer.insertAdjacentHTML('beforeend', `<div class="kat" style="left:${k.x - 8}px;top:${k.y}px;--c:${k.c}"><i></i><u style="width:${etiketX - k.x - 8}px"></u><span>${k.ad}</span></div>`)
  }
</script>
</body>
</html>
