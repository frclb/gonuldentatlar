<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="hikaye-ortak.css">
<style>
  /* Tam ekran kaşık fotoğrafı; zemin: yeni-gorseller/kasik-zemin.jpg (Gemini, deneme/kasik-2.jpg) */
  body { background: #efe6d6; }
  body::before, body::after { display: none; }
  .bg { position: absolute; inset: 0; width: 1080px; height: 1920px; }

  .head { position: absolute; left: 72px; right: 72px; top: 250px; }
  h1 { margin-top: 18px; font-size: 98px; line-height: 1; }
  h1 em { color: #b0523f; }

  .not { position: absolute; left: 76px; top: 640px; font-size: 58px; color: var(--cocoa-600); transform: rotate(-4deg); }
  .not svg { display: block; margin: 4px 0 0 118px; }

  .alt { position: absolute; left: 72px; right: 72px; top: 1510px; }
  .urun { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 500; color: var(--cocoa-900); }
  .urun span { font-family: 'DM Sans', sans-serif; font-size: 28px; font-weight: 500; color: #5c4537; }
  .cta { margin-top: 14px; display: flex; align-items: center; gap: 28px; }
  .cta .pill { padding: 18px 36px; font-size: 31px; }
  .cta .meta { font-size: 27px; line-height: 1.3; }
</style>
</head>
<body>
  <img class="bg" src="../../yeni-gorseller/kasik-zemin.jpg" alt="">

  <header class="head z">
    <div class="eyebrow"><img src="marka-isareti-kakao.svg" alt="">Gönülden Tatlar · Bursa</div>
    <h1>Bir kaşık dersin,<br><em>kavanoz biter.</em></h1>
  </header>

  <p class="script not z">işte o kaşık
    <svg width="170" height="90" viewBox="0 0 170 90" fill="none" stroke="#764a34" stroke-width="3.5" stroke-linecap="round">
      <path d="M8 8c18 40 66 62 148 62"/><path d="M138 52l20 18-24 12"/>
    </svg>
  </p>

  <section class="alt z">
    <p class="urun">Çilekli Magnolya<span class="dotsep"></span><span>Cup ya da kavanozda, her gün taze</span></p>
    <div class="cta">
      <span class="pill">Sipariş için DM’den yaz</span>
      <p class="meta">ya da WhatsApp<br><b>0536 994 85 17</b></p>
    </div>
  </section>
</body>
</html>
