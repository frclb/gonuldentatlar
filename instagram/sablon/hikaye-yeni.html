<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=block" rel="stylesheet">
<style>
  :root {
    --cocoa-900: #2b1811; --cocoa-800: #40251a; --cocoa-600: #764a34; --cocoa-400: #ac7d60;
    --cream-50: #fdfaf5; --cream-200: #eadcc8; --velvet: #e0796d;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { position: relative; font-family: 'DM Sans', sans-serif; color: var(--cream-50);
         background: radial-gradient(90% 45% at 50% 30%, #4a2a1c, transparent 75%), linear-gradient(#2b1811, #1f110b); }

  .head { position: absolute; left: 80px; right: 80px; top: 200px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-size: 25px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--cream-200); }
  .eyebrow img { width: 52px; height: 52px; }
  .badge { padding: 12px 26px; border-radius: 999px; background: var(--velvet); color: var(--cocoa-900);
           font-size: 25px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  h1 { margin-top: 34px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 124px; line-height: .94; letter-spacing: -.02em; }
  h1 em { font-style: italic; font-weight: 500; color: var(--velvet); }
  .sub { margin-top: 26px; font-size: 33px; line-height: 1.4; color: var(--cream-200); max-width: 860px; }

  /* Sitedeki kare görselden (1100 px) kabı içine alan kesit */
  .ph { position: absolute; left: 80px; right: 80px; top: 630px; height: 760px; border-radius: 44px;
        background: url('../../public/images/products/cilekli-red-velvet-magnolya.webp') no-repeat;
        background-size: 1045px auto; background-position: -63px -190px;
        box-shadow: 0 30px 70px rgba(0, 0, 0, .45), 0 0 0 1px rgba(253, 250, 245, .08); }
  .chips { position: absolute; left: 80px; right: 80px; top: 1420px; display: flex; gap: 16px; justify-content: center; }
  .chip { padding: 14px 26px; border-radius: 999px; border: 2px solid rgba(234, 220, 200, .35); font-size: 27px; font-weight: 500; color: var(--cream-200); }

  .cta { position: absolute; left: 72px; right: 72px; top: 1506px; text-align: center; }
  .cta .btn { display: inline-flex; align-items: center; gap: 16px; padding: 26px 46px; border-radius: 999px;
              background: var(--cream-50); color: var(--cocoa-900); font-size: 36px; font-weight: 600; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); }
  .cta .meta { margin-top: 24px; font-size: 28px; font-weight: 500; color: var(--cream-200); }
  .cta .meta b { font-weight: 700; color: var(--cream-50); }
  .cta .sep { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cocoa-400); margin: 0 18px 6px; }
</style>
</head>
<body>
  <header class="head">
    <div class="row">
      <div class="eyebrow"><img src="marka-isareti-krem.svg" alt="">Gönülden Tatlar</div>
      <span class="badge">Yeni</span>
    </div>
    <h1>Çilekli<br><em>Red Velvet</em></h1>
    <p class="sub">Red velvet kırıkları, süt kreması ve taze çilek.</p>
  </header>

  <div class="ph"></div>
  <div class="chips"><span class="chip">Cup</span><span class="chip">Kavanoz</span></div>

  <section class="cta">
    <div class="btn">Sipariş için DM’den yaz</div>
    <p class="meta">WhatsApp <b>0535 873 43 73</b><span class="sep"></span>gonuldentatlar.com</p>
  </section>
</body>
</html>
